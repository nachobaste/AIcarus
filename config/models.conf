# config/models.conf — model and effort per role, read by lib/models.sh.
#
#   role=model          exact model ID (avoid aliases like "opus": they move when a
#                       new model ships)
#   role.effort=level   low | medium | high | xhigh | max
#
# The scripts read this file themselves, so it applies to scheduled runs too (the
# launchd jobs pass no environment). Per value, the first one set wins:
#   DEVBRAIN_MODEL_<ROLE> / DEVBRAIN_EFFORT_<ROLE> in the environment,
#   then the older DEVBRAIN_PLAN_MODEL/_EFFORT and DEVBRAIN_EXEC_MODEL/_EFFORT,
#   then this file, then the default shown below.
# DEVBRAIN_MODELS_FILE points at a different file.
#
# A value starting with "-", with spaces, or outside [A-Za-z0-9._:/-] is rejected and
# that call does not run. Permission mode, allowed/disallowed tools and timeouts are
# not configurable here, on purpose.
#
# Every line below is commented out: the value shown is the default. An empty value
# means "no flag" (Claude Code's own default applies).

# plan=claude-opus-5-5              # bin/devbrain plan
# plan.effort=high
# execute=claude-sonnet-5-5         # bin/devbrain execute (implementation)
# execute.effort=medium
# review=                           # bin/devbrain execute (adversarial reviewer); empty = plan's
# review.effort=
# research=claude-opus-5-5          # bin/devbrain-research (findings and promote passes)
# research.effort=
# interview=claude-opus-5-5         # bin/devbrain-interview (interactive)
# interview.effort=
# digest=                           # bin/devbrain-digest (morning summary)
# digest.effort=
# wikilint=                         # bin/devbrain-wiki-lint
# wikilint.effort=
#
# The Telegram router is not one of these roles: it runs inside OpenClaw, which picks
# its model (`openclaw models set <provider/model>`).
